name: CI

on:
  push:
    branches: ['**']   # every branch; a tag push would only repeat the branch's run
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, strings and release build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Strings (no Korean in code, every key translated)
        run: python3 scripts/check-strings.py

      - name: Core tests
        run: swift test

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/TokenCats.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Release build (universal, ad-hoc signed, signature verified)
        run: scripts/build-app.sh

      - name: Build log on failure
        if: failure()
        run: tail -n 200 build/xcodebuild.log || true
